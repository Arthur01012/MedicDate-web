<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedicDate | Mi agenda</title>
  <link rel="stylesheet" href="../../../styles/panel_privado.css">
</head>
<body>
  <div class="priv">
    <div id="slotLateral"></div>

    <div class="pc">
      <div class="bar">
        <h1>Mi agenda</h1>
        <div class="u">
          <span class="av" id="topbarAvatar">JR</span>
          <span id="topbarUsuario">Dr. José Manuel Rodríguez López · Médico</span>
          <a class="btn btn-o btn-s" href="../../../index.html">Ver portal</a>
          <button type="button" class="btn btn-o btn-s" id="btnCerrarSesion">Cerrar sesión</button>
        </div>
      </div>

      <div class="panel">
        <div class="filt" style="align-items:center">
          <div class="filtro" style="margin:0">
            <button type="button" class="fbtn on" data-lapso="hoy">Hoy</button>
            <button type="button" class="fbtn" data-lapso="semana">Próximos 7 días</button>
            <button type="button" class="fbtn" data-lapso="todas">Todas</button>
          </div>
          <div class="campo" style="margin-left:auto">
            <label for="filtroEstadoDoc">Estado</label>
            <select id="filtroEstadoDoc">
              <option value="">Todos</option>
              <option value="Programada">Programada</option>
              <option value="Atendida">Atendida</option>
              <option value="Cancelada">Cancelada</option>
            </select>
          </div>
        </div>

        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>Día</th>
                <th>Hora</th>
                <th>Paciente</th>
                <th>Motivo</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbodyMiAgenda"></tbody>
          </table>
          <div id="estadoVacio" class="vacio oculto">No hay citas con esos filtros.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="slotModalCita"></div>
  <div id="toast"></div>

  <script src="../../../service/api_config.js"></script>
  <script src="../../../service/doctor_service.js"></script>
  <script src="../../../scripts/ui_common.js"></script>
  <script src="../../../scripts/filtros.js"></script>
  <script src="../../../scripts/doctor_agenda.js"></script>
</body>
</html>
