<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedicDate | Pacientes (Asistente)</title>
  <link rel="stylesheet" href="../../../styles/panel_privado.css">
</head>
<body>
  <div class="priv">
    <div id="slotLateral"></div>

    <main class="pc">
      <header class="bar">
        <h1>Pacientes</h1>
        <div class="u">
          <span class="av" id="topbarAvatar">AS</span>
          <span id="topbarUsuario">Asistente</span>
          <a class="btn btn-o btn-s" href="../../../index.html">Ver portal</a>
          <button type="button" class="btn btn-o btn-s" id="btnCerrarSesion">Cerrar sesión</button>
        </div>
      </header>

      <div id="alertaError" class="aviso-alerta oculto" role="alert"></div>

      <section class="panel">
        <div class="aviso-lectura">
          <span>Consulta el directorio de pacientes y su historial de citas (solo lectura).</span>
          <span class="badge b-gris">Solo lectura</span>
        </div>

        <div class="filt">
          <div class="campo" style="min-width: 280px; flex: 1; max-width: 420px;">
            <label for="inputBuscarPaciente">Buscar</label>
            <input id="inputBuscarPaciente" type="search" placeholder="Nombre, correo o teléfono">
          </div>
          <button type="button" class="btn btn-o btn-s" id="btnLimpiarBusqueda">Limpiar</button>
        </div>

        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>Paciente</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Edad</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbodyPacientes"></tbody>
          </table>
          <div id="estadoVacio" class="vacio">Cargando pacientes...</div>
        </div>
      </section>
    </main>
  </div>

  <div id="slotModalPaciente"></div>
  <div id="toast" aria-live="polite"></div>

  <script src="../../../service/api_config.js"></script>
  <script src="../../../service/asistente_service.js"></script>
  <script src="../../../scripts/ui_common.js"></script>
  <script src="../../../scripts/filtros.js"></script>
  <script src="../../../scripts/asistente_pacientes.js"></script>
</body>
</html>
