<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedicDate | Resumen</title>
  <link rel="stylesheet" href="../../../styles/panel_privado.css">
</head>
<body>
  <div class="priv">
    <div id="slotLateral"></div>

    <div class="pc">
      <div class="bar">
        <h1>Resumen</h1>
        <div class="u">
          <span class="av" id="topbarAvatar">MD</span>
          <span id="topbarUsuario">Médico</span>
          <a class="btn btn-o btn-s" href="../../../index.html">Ver portal</a>
          <button type="button" class="btn btn-o btn-s" id="btnCerrarSesion">Cerrar sesión</button>
        </div>
      </div>

      <div class="panel" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">
        <div>
          <h2 id="saludoDoctor" style="font-size:22px">Hola</h2>
          <p id="subtituloDoctor" style="margin:4px 0 0;color:var(--suave)">Cargando perfil...</p>
        </div>
        <a class="btn btn-o btn-s" id="btnPerfilPublico" href="../../../index.html">Ver mi perfil público</a>
      </div>

      <div class="resu">
        <div class="card"><b id="kpiHoy">0</b><span>Citas hoy</span></div>
        <div class="card"><b id="kpiPorAtender">0</b><span>Por atender hoy</span></div>
        <div class="card"><b id="kpiAtendidasHoy">0</b><span>Atendidas hoy</span></div>
        <div class="card"><b id="kpiProximos7">0</b><span>Próximos 7 días</span></div>
        <div class="card"><b id="kpiPacientes">0</b><span>Pacientes</span></div>
      </div>

      <div class="grid g2">
        <div class="panel">
          <h3 style="font-size:18px;margin-bottom:12px">Siguiente por atender</h3>
          <div id="boxSiguienteCita"></div>
        </div>

        <div class="panel">
          <h3 style="font-size:18px;margin-bottom:12px">Citas de los próximos 7 días</h3>
          <div id="grafica7Dias" style="display:flex;gap:10px;align-items:flex-end;height:130px"></div>
        </div>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3 style="font-size:18px">Agenda de hoy</h3>
          <a class="btn btn-o btn-s" href="./mi_agenda.html">Ver toda mi agenda</a>
        </div>

        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>Día</th>
                <th>Hora</th>
                <th>Paciente</th>
                <th>Motivo</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbodyAgendaHoy"></tbody>
          </table>
          <div id="estadoVacioHoy" class="vacio oculto">No tienes citas para hoy.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="slotModalCita"></div>
  <div id="toast"></div>

  <script src="../../../service/api_config.js"></script>
  <script src="../../../service/doctor_service.js"></script>
  <script src="../../../scripts/ui_common.js"></script>
  <script src="../../../scripts/doctor_resumen.js"></script>
</body>
</html>
